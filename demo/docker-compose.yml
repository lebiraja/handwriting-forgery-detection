# Demo service: upload a reference page and a questioned page, get a verdict. CPU only so it never competes
# with the GPU training queue.   docker compose up -d   ->   http://localhost:8010
services:
  demo:
    image: handwriting-train:0.1
    command: uvicorn demo.main:app --host 0.0.0.0 --port 8000
    user: "1000:1000"
    working_dir: /app
    cpus: "3"
    environment:
      HOME: /tmp
      PYTHONPATH: /app
      CUDA_VISIBLE_DEVICES: ""
      MODEL_DIR: /model
      DEMO_THREADS: "3"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ../train/src:/app/src:ro
      - ../train/runs/main_s0:/model:ro
      - ../datasets:/data:ro
      - ./app:/app/demo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
