# Demo service: upload a reference page and a questioned page, get a verdict. CPU only so it never competes
# with the GPU training queue.   docker compose up -d --build   ->   http://localhost:8010
# Weights are downloaded from the public HF repo on first start (cached in a volume). Device: GPU if available, else CPU.
# GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  demo:
    build: .
    image: handwriting-demo:0.1
    command: uvicorn demo.main:app --host 0.0.0.0 --port 8000
    user: "1000:1000"
    working_dir: /app
    cpus: "3"
    environment:
      HOME: /tmp
      PYTHONPATH: /app
      DEMO_DEVICE: ${DEMO_DEVICE:-auto}
      HF_REPO: lebiraja/handwriting-forgery-pageencoder
      HF_HOME: /hf
      MODEL_DIR: /model
      DEMO_THREADS: "3"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ../train/src:/app/src:ro
      - ./.hf_cache:/hf
      - ../datasets:/data:ro
      - ./app:/app/demo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

